session_name: musictools-rs
shell_command_before: "export RUST_LOG=info; sleep 2;"
windows:
  - window_name: code
    focus: true
    start-directory: ./
    panes:
      - shell_command:
        - hx

  - window_name: agent
    start-directory: ./
    panes:
      - shell_command:
        - codex
  - window_name: cmd1
    start-directory: ./
    panes:
      - shell_command:
        - clear
  - window_name: cmd2
    start-directory: ./
    panes:
      - shell_command:
        - clear
  - window_name: notes
    panes:
      - shell_command:
        - yazi
