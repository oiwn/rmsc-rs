[workspace]
resolver = "3"
members = [
    "crates/musictools-core",
    "crates/bogdan-dsp",
    "crates/kirya-dsp",
    "crates/igorek-dsp",
    "plugins/bogdan",
    "plugins/kirya",
    "plugins/igorek",
]
default-members = [
    "crates/musictools-core",
    "crates/bogdan-dsp",
    "crates/kirya-dsp",
    "crates/igorek-dsp",
    "plugins/bogdan",
    "plugins/kirya",
    "plugins/igorek",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["oiwn <blank@gmail.com>"]
license = "MIT"
repository = "https://github.com/oiwn/musictools-rs"

[workspace.dependencies]
musictools-core = { path = "crates/musictools-core" }
bogdan-dsp = { path = "crates/bogdan-dsp" }
kirya-dsp = { path = "crates/kirya-dsp" }
igorek-dsp = { path = "crates/igorek-dsp" }
realfft = "3"
hound = "3.5"
rand = "0.9"
rfd = { version = "0.15", default-features = false }
truce = { version = "=6.3.0" }
truce-egui = { version = "=6.3.0" }
truce-clap = { version = "=6.3.0" }
truce-vst3 = { version = "=6.3.0" }
egui = "0.34"
clap-sys = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
