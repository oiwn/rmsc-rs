[workspace]
resolver = "3"
members = [
    "crates/musictools-core",
    "crates/bogdan-dsp",
    "plugins/bogdan",
]
default-members = [
    "crates/musictools-core",
    "crates/bogdan-dsp",
    "plugins/bogdan",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["oiwn <blank@gmail.com>"]
license = "MIT"
repository = "https://github.com/oiwn/musictools-rs"

[workspace.dependencies]
musictools-core = { path = "crates/musictools-core" }
bogdan-dsp = { path = "crates/bogdan-dsp" }
truce = { version = "=6.3.0" }
truce-egui = { version = "=6.3.0" }
truce-clap = { version = "=6.3.0" }
truce-vst3 = { version = "=6.3.0" }
egui = "0.34"
clap-sys = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
